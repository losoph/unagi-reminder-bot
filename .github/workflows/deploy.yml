name: Deploy to VDS

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  # Проверки (без деплоя) на PR: ужесточение контейнера нельзя проверить иначе, чем собрав образ.
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint (pyflakes errors only)
        run: pipx run ruff==0.16.8 check .
      # Тесты, требующие утилит хоста (git, docker): в образе python:3.12-slim их нет, поэтому в образе они пропускаются (skipUnless).
      - name: Run host environment regression tests (git/docker)
        run: python3 -m unittest tests/test_deploy_sync.py tests/test_orchestra.py tests/test_dep2_deploy_verify.py tests/test_cron_files.py -v
      - name: Build production image
        run: docker build -t unagi-reminder-bot:test .
      # --entrypoint: тесты идут от root без точки входа, как раньше; под ограничениями контейнера образ проверяет смоук ниже.
      - name: Run regression tests
        run: docker run --rm --entrypoint python unagi-reminder-bot:test -m unittest discover -s tests -v
      # Флаги те же, что в docker-compose.yml (согласованность держит tests/test_container_hardening.py).
      - name: Smoke test hardened container
        run: |
          storage="$(mktemp -d)"
          secrets="$(mktemp -d)"
          # Как на проде: msmtprc принадлежит root и закрыт 0600.
          printf 'defaults\nhost smtp.example.test\nport 587\nfrom unagi@example.test\nuser unagi\npassword secret\n' | sudo tee "$secrets/msmtprc" > /dev/null
          sudo chown root:root "$secrets/msmtprc"
          sudo chmod 0600 "$secrets/msmtprc"
          docker run --rm --network host --read-only \
            --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges:true --tmpfs /tmp:size=64m,mode=1777 --tmpfs /run/unagi:size=1m,mode=0755 \
            -v "$storage:/app/storage" -v "$secrets/msmtprc:/run/secrets/msmtprc:ro" \
            -e DB_PATH=/app/storage/bot_data.db -e MSMTPRC_PATH=/run/unagi/msmtprc -e BOT_TOKEN=123456:smoke \
            unagi-reminder-bot:test python ops/docker/smoke.py

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 — закреплено по коммиту: плавающий ref получал приватный SSH-ключ деплоя
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd ~/projects/unagi-reminder-bot
            # --- sync (tests/test_deploy_sync.py исполняет этот блок во временном репозитории)
            # docker-compose.yml на сервере вручную не правят (лимит CPU — BOT_CPUS в .env): сбрасываем ручную правку и конфликт прошлого autostash —
            # 17.10 `git pull --autostash` вернул код 0 при конфликте возврата stash, в compose остались маркеры и `docker compose up` упал на YAML.
            git checkout HEAD -- docker-compose.yml
            git pull --ff-only origin main
            test -z "$(git ls-files -u)" || { echo "конфликт слияния в рабочем дереве сервера — деплой остановлен"; git status --short; exit 1; }
            # --- end sync
            # Снимок БД до пересборки не от root (миграции только добавляют, но откат данных должен быть возможен).
            # Каталог storage/backups принадлежит uid 10001, чтобы файлы -wal/-shm не блокировали запись боту.
            mkdir -p storage/backups && chown -R 10001:10001 storage
            setpriv --reuid=10001 --regid=10001 --clear-groups python3 ops/aiqu/backup_db.py --db storage/bot_data.db || { echo "резервная копия не создана — деплой остановлен"; exit 1; }
            # Откатный тег: обновляем rollback только если текущий контейнер здоров (State.Status=running и RestartCount=0).
            # Сценарий: деплой упал на liveness, следующий деплой не должен затереть рабочий образ сломанным.
            current_image="$(docker inspect -f '{{.Image}}' unagi-bot 2>/dev/null || true)"
            current_status="$(docker inspect -f '{{.State.Status}}' unagi-bot 2>/dev/null || echo missing)"
            current_restarts="$(docker inspect -f '{{.RestartCount}}' unagi-bot 2>/dev/null || echo -1)"
            if [ -n "$current_image" ] && [ "$current_status" = "running" ] && [ "$current_restarts" = "0" ]; then
              docker tag "$current_image" unagi-reminder-bot-bot:rollback 2>/dev/null || true
            fi
            # Диск до сборки (порог ALERT prod_check — 85%): очистка старого кеша и висячих образов перед up --build
            disk_pre="$(df --output=pcent . 2>/dev/null | tail -n 1 | tr -dc '0-9')"
            if [ -n "$disk_pre" ] && [ "$disk_pre" -ge 85 ]; then
              echo "диск ${disk_pre}% >= 85% до сборки: очистка кеша сборки и висячих образов"
              docker builder prune -f || true
              docker image prune -f || true
            fi
            export GIT_SHA="$(git rev-parse --short HEAD)"
            docker compose up -d --build
            # --- liveness (tests/test_dep2_deploy_verify.py исполняет этот блок во временной среде)
            wait_limit="${DEPLOY_WAIT_SECS:-60}"
            [ "$wait_limit" -le 0 ] 2>/dev/null && wait_limit=60
            interval=2
            stable_target=10
            elapsed=0
            stable_seconds=0
            prev_restarts=""
            is_ready=0

            while [ "$elapsed" -lt "$wait_limit" ]; do
              sleep "$interval"
              elapsed=$((elapsed + interval))

              status="$(docker inspect -f '{{.State.Status}}' unagi-bot 2>/dev/null || echo missing)"
              restarts="$(docker inspect -f '{{.RestartCount}}' unagi-bot 2>/dev/null || echo -1)"
              container_sha="$(docker inspect -f '{{ index .Config.Labels "org.unagi.git_sha" }}' unagi-bot 2>/dev/null || echo missing)"

              if [ "$status" != "running" ] || [ "$container_sha" != "$GIT_SHA" ] || [ "$restarts" -gt 1 ] 2>/dev/null || [ "$restarts" -lt 0 ] 2>/dev/null; then
                stable_seconds=0
                prev_restarts="$restarts"
              elif ! docker exec unagi-bot test -f /run/unagi/ready >/dev/null 2>&1; then
                stable_seconds=0
                prev_restarts="$restarts"
              else
                if [ -n "$prev_restarts" ] && [ "$restarts" = "$prev_restarts" ]; then
                  stable_seconds=$((stable_seconds + interval))
                else
                  stable_seconds=0
                  prev_restarts="$restarts"
                fi
                if [ "$stable_seconds" -ge "$stable_target" ]; then
                  is_ready=1
                  break
                fi
              fi
            done

            if [ "$is_ready" != "1" ]; then
              echo "деплой остановлен: контейнер не готов за ${wait_limit}s: не в статусе running, перезапускался, маркер готовности не найден или метка версии не совпадает (status=$status, restart_count=$restarts, container_sha=$container_sha, expected=$GIT_SHA, stable=${stable_seconds}s)"
              docker logs --tail 30 unagi-bot || true
              # --- rollback
              if docker inspect unagi-reminder-bot-bot:rollback >/dev/null 2>&1; then
                echo "откат: запуск контейнера из unagi-reminder-bot-bot:rollback"
                docker tag unagi-reminder-bot-bot:rollback unagi-reminder-bot-bot:latest
                # Метка версии — не HEAD: в контейнере старый образ, prod_check должен показать ALERT «контейнер на старом коде».
                GIT_SHA=rollback docker compose up -d
                echo "откат выполнен"
              fi
              # --- end rollback
              exit 1
            fi
            # --- end liveness
            # Диск: каждая пересборка оставляет прежние слои образа и кеш сборки (78% → 82% за три деплоя 17.10, порог тревоги prod_check — 85%).
            # Только висячие образы и старый кеш сборки; запущенный контейнер и его образ не затрагиваются. Сбой очистки деплой не ломает.
            docker image prune -f || true
            docker builder prune -f --filter until=6h || true
            # Защита от переполнения диска 9.8 ГБ (порог ALERT prod_check — 85%): если места мало, удаляем rollback-образ
            disk_pct="$(df --output=pcent . 2>/dev/null | tail -n 1 | tr -dc '0-9')"
            if [ -n "$disk_pct" ] && [ "$disk_pct" -ge 85 ]; then
              echo "диск ${disk_pct}% >= 85%: удаление rollback-образа для защиты от переполнения"
              docker rmi unagi-reminder-bot-bot:rollback 2>/dev/null || true
              docker image prune -f || true
              # 18.10: кеш сборки 2 ГБ, из них 1,6 ГБ свободны, но моложе 6 ч — фильтр until их не берёт. Неиспользуемый кеш чистим целиком только при тревоге по диску.
              docker builder prune -f || true
            fi
            # Cron-файлы из репозитория: удаление устаревших и идемпотентная установка актуальных
            for installed in /etc/cron.d/unagi-*; do
              if [ -f "$installed" ] && [ ! -f "ops/aiqu/cron.d/$(basename "$installed")" ]; then
                echo "удаление устаревшего cron-файла: $installed"
                rm -f "$installed" || true
              fi
            done
            for f in ops/aiqu/cron.d/*; do
              [ -f "$f" ] && install -m 0644 -o root -g root "$f" "/etc/cron.d/$(basename "$f")" || true
            done
