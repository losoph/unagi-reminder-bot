name: Deploy to VDS

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t unagi-reminder-bot:test .
      - name: Run digest regression tests
        run: docker run --rm unagi-reminder-bot:test python -m unittest discover -s tests -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/projects/unagi-reminder-bot
            git pull origin main
            docker compose up -d --build
