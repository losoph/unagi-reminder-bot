# Харденинг 2026-10-11. Файл читается раньше 50-cloud-init.conf, а в sshd
# действует первое значение — поэтому PasswordAuthentication отсюда побеждает
# провайдерский cloud-init.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
